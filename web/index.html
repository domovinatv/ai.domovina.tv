<body>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Service Worker update detection + forced check on every page load.
    // Safari iOS caches SW aggressively — reg.update() forces re-fetch.
    // SW je presudan za PWA install (Add to Home Screen → standalone) koji
    // iOS koristi za cross-app background audio privilegije (npr. otvoriš
    // WhatsApp, naš audio nastavi raditi). Bez SW: Media Session API drži
    // tab-level audio (radi unutar browsera) ali iOS suspendira tab čim
    // user prijeđe na drugu app-u.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.ready.then(function(reg) {
        reg.update();
        reg.addEventListener('updatefound', function() {
          var newWorker = reg.installing;
          if (!newWorker) return;
          newWorker.addEventListener('statechange', function() {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              window.dispatchEvent(new Event('flutter-app-updated'));
            }
          });
        });
      });
    }
  </script>
</body>
