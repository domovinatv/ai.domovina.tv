  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Default meta — episode pages get overridden server-side by _worker.js -->
  <title>Domovina.ai</title>
  <meta name="description" content="AI-obrađeni hrvatski podcasti — transkripti, sažeci i analiza epizoda.">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Domovina.ai">

  <meta property="og:description" content="AI-obrađeni hrvatski podcasti — transkripti, sažeci i analiza epizoda.">
  <meta property="og:url" content="https://domovina.ai">

  <meta name="twitter:card" content="summary">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Domovina.ai">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Service Worker update detection + forced check on every page load.
    // Safari iOS caches SW aggressively — reg.update() forces re-fetch.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.ready.then(function(reg) {
        // Force SW update check on every page load
        reg.update();

        reg.addEventListener('updatefound', function() {
          var newWorker = reg.installing;
          if (!newWorker) return;
          newWorker.addEventListener('statechange', function() {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              window.dispatchEvent(new Event('flutter-app-updated'));
            }
          });
        });
      });
    }
  </script>
</body>
</html>
