  <rect x="0" y="624" width="400" height="6" fill="#FF0000"/>
  <rect x="400" y="624" width="400" height="6" fill="#FFFFFF"/>
  <rect x="800" y="624" width="400" height="6" fill="#002F6C"/>

  <!-- Logo D shape (scaled from 512 to ~200px, centered at x=390) -->
